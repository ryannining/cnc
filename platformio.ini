[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino

lib_deps =
    ESP8266WiFi
    ESP8266WebServer
    LittleFS
    Links2004/arduinoWebSockets
    bblanchon/ArduinoJson@^6.21.0

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    WiFi
    WebServer
    FS
    LittleFS
    mathieu-caroff/WebSockets
